name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vento
          POSTGRES_PASSWORD: vento
          POSTGRES_DB: vento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vento -d vento_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # CI-only placeholders for the throwaway service database above. Not secrets.
    env:
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://vento:vento@localhost:5432/vento_test
      TEST_DATABASE_URL: postgres://vento:vento@localhost:5432/vento_test
      LOG_LEVEL: warn
      # Throwaway signing secret for CI's test database only; never used anywhere real.
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-real-use-000000
      # dev: e2e reads verification codes from the files it writes to .mail/
      EMAIL_TRANSPORT: dev
      EMAIL_DEV_DIR: .mail
      # Many sign-ins from one IP in e2e; no calls to Have I Been Pwned from CI.
      AUTH_RATE_LIMIT: "off"
      PWNED_PASSWORDS_CHECK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @vento/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
