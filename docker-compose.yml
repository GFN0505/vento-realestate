# Local development database only. Credentials here are local placeholders, not secrets.
services:
  postgres:
    image: postgres:18-alpine
    container_name: vento-postgres
    environment:
      POSTGRES_USER: vento
      POSTGRES_PASSWORD: vento
      POSTGRES_DB: vento
    ports:
      - "5432:5432"
    volumes:
      - vento-pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vento -d vento"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  vento-pgdata:
