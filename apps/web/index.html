<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vento Real Estate: the operating system for Nigerian real estate developers." />
    <meta name="color-scheme" content="light" />
    <title>Vento Real Estate</title>
    <script>
      // Before first paint: the theme (light by default; 'dark' or 'system' when chosen in the
      // user menu), the collapsed sidebar and its width, so nothing flashes or shifts. The keys
      // and values must match src/lib/theme.ts (a unit test reads this script).
      ;(() => {
        try {
          const root = document.documentElement
          const stored = localStorage.getItem('vento-theme')
          const dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            root.classList.add('dark')
            root.style.colorScheme = 'dark'
          }
          if (localStorage.getItem('vento-sidebar') === 'collapsed') {
            root.dataset.sidebar = 'collapsed'
          }
          const width = Number(localStorage.getItem('vento-sidebar-width'))
          if (width >= 220 && width <= 320) {
            root.style.setProperty('--sidebar-open-width', `${width}px`)
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
