<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vento: the operating system for Nigerian real estate developers." />
    <meta name="color-scheme" content="light dark" />
    <title>Vento</title>
    <script>
      // Set the theme before first paint so dark-mode users never see a white flash.
      // A stored choice (brick 3 adds the toggle) wins over the system setting.
      ;(() => {
        try {
          const stored = localStorage.getItem('vento-theme')
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
