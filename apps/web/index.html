<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vento Real Estate: the operating system for Nigerian real estate developers." />
    <meta name="color-scheme" content="light" />
    <title>Vento Real Estate</title>
    <script>
      // Set the theme before first paint. Light is the default (owner's choice); a stored
      // choice of 'dark' or 'system' (the toggle arrives in brick 3) overrides it.
      ;(() => {
        try {
          const stored = localStorage.getItem('vento-theme')
          const dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
